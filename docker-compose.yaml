services:
  db_axolotto:
    image: postgres:16-alpine
    container_name: axolotto_db
    restart: always
    environment:
      POSTGRES_USER: ${AXO_DB_USER}
      POSTGRES_PASSWORD: ${AXO_DB_PASSWORD}
      POSTGRES_DB: axolotto_app_db
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - axolotto_data:/var/lib/postgresql/data
    networks:
      - axolotto_net

  anvil_axolotto:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: axolotto_anvil
    restart: always
    ports:
      - "127.0.0.1:8545:8545"
    entrypoint:
      - "anvil"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8545"
      - "--accounts"
      - "10"
      - "--balance"
      - "10000"
      - "--block-time"
      - "1"
    networks:
      - axolotto_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend_axolotto:
    build: ./backend
    container_name: axolotto_backend
    restart: always
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://${AXO_DB_USER}:${AXO_DB_PASSWORD}@db_axolotto:5432/axolotto_app_db
      - PRIVY_APP_ID=${PRIVY_APP_ID}
      - PRIVY_APP_SECRET=${PRIVY_APP_SECRET}
      - TRIDY_API_KEY=${TRIDY_API_KEY}
      - ADMIN_PRIVY_DID=${ADMIN_PRIVY_DID}
      - PRODUCT_MODE=${PRODUCT_MODE:-non_gambling}
      - ENABLE_FIAT_PAYMENTS=${ENABLE_FIAT_PAYMENTS:-false}
      - ENABLE_CRYPTO_CHECKOUT=${ENABLE_CRYPTO_CHECKOUT:-false}
      - ENABLE_PLAYER_MARKETPLACE=${ENABLE_PLAYER_MARKETPLACE:-false}
      - ENABLE_CREATOR_PAYOUTS=${ENABLE_CREATOR_PAYOUTS:-false}
      - ENABLE_VIP_SALES=${ENABLE_VIP_SALES:-false}
      - ENABLE_FREE_GAMEPLAY=${ENABLE_FREE_GAMEPLAY:-true}
      - ENABLE_PAID_GAMEPLAY=${ENABLE_PAID_GAMEPLAY:-false}
      - ENABLE_GAMEPLAY_TOKEN_REWARDS=${ENABLE_GAMEPLAY_TOKEN_REWARDS:-false}
      - ENABLE_JACKPOT=${ENABLE_JACKPOT:-false}
      - ENABLE_PURCHASED_RANDOM_REWARDS=${ENABLE_PURCHASED_RANDOM_REWARDS:-false}
      - ENABLE_TOKEN_CASHOUT=${ENABLE_TOKEN_CASHOUT:-false}
      - ENABLE_PLAYER_TOKEN_TRANSFERS=${ENABLE_PLAYER_TOKEN_TRANSFERS:-false}
      - ENABLE_CLIENT_REPORTED_REWARDS=${ENABLE_CLIENT_REPORTED_REWARDS:-false}
      - ENABLE_PROMOTIONAL_TOKEN_REWARDS=${ENABLE_PROMOTIONAL_TOKEN_REWARDS:-false}
      - ENABLE_ADMIN_TOKEN_MINTS=${ENABLE_ADMIN_TOKEN_MINTS:-false}
      - ENABLE_ADMIN_BALANCE_ADJUSTMENTS=${ENABLE_ADMIN_BALANCE_ADJUSTMENTS:-false}
      - ENABLE_PASSIVE_TOKEN_REWARDS=${ENABLE_PASSIVE_TOKEN_REWARDS:-false}
      - ENABLE_LEGACY_ASSET_CLAIMS=${ENABLE_LEGACY_ASSET_CLAIMS:-false}
      - ENABLE_FIXED_ITEM_SHOP=${ENABLE_FIXED_ITEM_SHOP:-false}
      - ENABLE_FIXED_GAMEPLAY_SPENDING=${ENABLE_FIXED_GAMEPLAY_SPENDING:-false}
      - ENABLE_CARD_CRAFTING=${ENABLE_CARD_CRAFTING:-false}
      - ENABLE_BOARD_ASSET_MUTATIONS=${ENABLE_BOARD_ASSET_MUTATIONS:-false}
      - ENABLE_HATCHING=${ENABLE_HATCHING:-false}
      - ENABLE_RECICLON=${ENABLE_RECICLON:-false}
      - REQUIRE_ADULT_FOR_COMMERCE=${REQUIRE_ADULT_FOR_COMMERCE:-true}
      - CHAIN_ECONOMY_AUTHORITATIVE=${CHAIN_ECONOMY_AUTHORITATIVE:-true}
      - PAYMENT_GATEWAY_PROVIDER=${PAYMENT_GATEWAY_PROVIDER:-mock}
      - KYC_PROVIDER=${KYC_PROVIDER:-}
      - LEGAL_ENTITY_NAME=${LEGAL_ENTITY_NAME:-}
      - TERMS_VERSION=${TERMS_VERSION:-}
      - PRIVACY_NOTICE_VERSION=${PRIVACY_NOTICE_VERSION:-}
    depends_on:
      - db_axolotto
      - anvil_axolotto
    networks:
      - axolotto_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  taskboard:
    build: ./tools/taskboard
    container_name: axolotto_taskboard
    restart: "no"
    ports:
      - "127.0.0.1:8181:8181"
    volumes:
      - .:/repo
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    networks:
      - axolotto_net

volumes:
  axolotto_data:

networks:
  axolotto_net:
